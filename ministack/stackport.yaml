apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackport
  namespace: ministack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stackport
  template:
    metadata:
      labels:
        app: stackport
    spec:
      enableServiceLinks: false
      containers:
        - name: stackport
          image: davireis/stackport:latest
          ports:
            - containerPort: 8080
          env:
            - name: AWS_ENDPOINT_URL
              value: "http://ministack.ministack.svc.cluster.local:4566"
            - name: AWS_ACCESS_KEY_ID
              value: "test"
            - name: AWS_SECRET_ACCESS_KEY
              value: "test"
            - name: AWS_REGION
              value: "us-east-1"
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: stackport
  namespace: ministack
spec:
  selector:
    app: stackport
  type: NodePort
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30014
