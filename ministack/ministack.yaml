apiVersion: v1
kind: Namespace
metadata:
  name: ministack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ministack
  namespace: ministack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ministack
  template:
    metadata:
      labels:
        app: ministack
    spec:
      containers:
        - name: ministack
          image: ministackorg/ministack:latest
          ports:
            - containerPort: 4566
          env:
            - name: GATEWAY_PORT
              value: "4566"
          resources:
            requests:
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_ministack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_ministack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ministack
  namespace: ministack
spec:
  selector:
    app: ministack
  type: ClusterIP
  ports:
    - name: gateway
      port: 4566
      targetPort: 4566
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ministack
  namespace: ministack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: duckdns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ministack.tpopov-homelab.duckdns.org
  rules:
    - host: ministack.tpopov-homelab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ministack
                port:
                  number: 4566
