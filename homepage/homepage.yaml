---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    layout:
      - Nodes:
          style: row
          columns: 2
      - Access:
      - UI Services:
      - Backend Services:
      - University:
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: |
  services.yaml: |
    - Nodes:
        - tpopov:
            description: Control-plane node
            icon: mdi-server
            widget:
              type: prometheusmetric
              url: http://prometheus.prometheus-stack.svc.cluster.local:9090
              refreshInterval: 1000
              metrics:
                - label: CPU
                  query: 100 - (avg(rate(node_cpu_seconds_total{mode="idle",instance="192.168.0.27:9100"}[2m])) * 100)
                  format:
                    type: percent
                - label: Memory
                  query: 100 * (1 - node_memory_MemAvailable_bytes{instance="192.168.0.27:9100"} / node_memory_MemTotal_bytes{instance="192.168.0.27:9100"})
                  format:
                    type: percent
                - label: Disk
                  query: 100 * (1 - node_filesystem_avail_bytes{instance="192.168.0.27:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="192.168.0.27:9100",mountpoint="/"})
                  format:
                    type: percent
                - label: CPU Temp
                  query: max(node_hwmon_temp_celsius{instance="192.168.0.27:9100",chip="platform_coretemp_0"})
                  format:
                    type: number
                    suffix: " °C"
                    decimals: 0
        - infra:
            description: Worker node
            icon: mdi-server
            widget:
              type: prometheusmetric
              url: http://prometheus.prometheus-stack.svc.cluster.local:9090
              refreshInterval: 1000
              metrics:
                - label: CPU
                  query: 100 - (avg(rate(node_cpu_seconds_total{mode="idle",instance="192.168.0.20:9100"}[2m])) * 100)
                  format:
                    type: percent
                - label: Memory
                  query: 100 * (1 - node_memory_MemAvailable_bytes{instance="192.168.0.20:9100"} / node_memory_MemTotal_bytes{instance="192.168.0.20:9100"})
                  format:
                    type: percent
                - label: Disk
                  query: 100 * (1 - node_filesystem_avail_bytes{instance="192.168.0.20:9100",mountpoint="/"} / node_filesystem_size_bytes{instance="192.168.0.20:9100",mountpoint="/"})
                  format:
                    type: percent
                - label: CPU Temp
                  query: max(node_hwmon_temp_celsius{instance="192.168.0.20:9100",chip="platform_coretemp_0"})
                  format:
                    type: number
                    suffix: " °C"
                    decimals: 0

    - Access:
        - GitHub:
            href: https://github.com/
            description: GitHub homepage
            icon: github.png
        - TailScale:
            href: https://login.tailscale.com/admin/machines
            description: Manage TailScale devices
            icon: tailscale.png
        - Hetzner Cloud:
            href: https://console.hetzner.com/projects
            description: Manage Hetzner Cloud resources
            icon: hetzner.png

    - UI Services:
        - Kubernetes Dashboard:
            href: https://dashboard.tpopov-homelab.duckdns.org/#/workloads?namespace=default
            description: View and manage Kubernetes resources
            ping: https://dashboard.tpopov-homelab.duckdns.org
            icon: kubernetes-dashboard.png
        - Grafana:
            href: http://infra:30010
            description: Metrics visualization and dashboards
            ping: http://infra:30010/api/health
            icon: grafana.png
        - Kibana:
            href: http://infra:30008
            description: Data visualization and exploration
            ping: http://infra:30008/api/status
            icon: kibana.png
        - Registry UI:
            href: http://infra:30501
            description: In-cluster Docker registry
            ping: http://infra:30501
            icon: docker.png
        - RabbitMQ Management:
            href: http://infra:30004/#/
            description: Manage RabbitMQ
            ping: http://infra:30004
            icon: rabbitmq.png
            username: admin
            password: admin
        - Mongo Express:
            href: http://infra:30012
            description: MongoDB browser UI
            ping: http://infra:30012
            icon: mongodb.png
        - StackPort:
            href: http://infra:30014
            description: AWS resource browser for Ministack
            ping: http://infra:30014
            icon: aws.png
        - Paperless:
            href: http://infra:30015
            description: Document management
            ping: http://infra:30015
            icon: paperless-ngx.png
    - Backend Services:
        - Prometheus:
            href: http://infra:30009
            description: Metrics collection and storage
            ping: http://infra:30009/-/healthy
            icon: prometheus.png
        - Elasticsearch:
            href: http://infra:30007
            description: Search and analytics engine
            ping: http://infra:30007
            icon: elasticsearch.png
        - Registry API:
            href: http://infra:30500
            description: Docker registry backend
            ping: http://infra:30500/v2/
            icon: docker.png
        - MongoDB:
            href: http://infra:30011
            description: MongoDB instance
            ping: http://infra:30011
            icon: mongodb.png
        - Redis:
            href: http://infra:30002
            description: Redis instance
            ping: http://infra:30002
            icon: redis.png
        - Ministack:
            href: http://infra:30013/_ministack/health
            description: Local AWS emulator
            ping: http://infra:30013/_ministack/health
            icon: aws.png

    - University:
        - NBU Official Website:
            href: https://www.nbu.bg
            description: NBU official website
        - Moodle:
            href: https://e-edu.nbu.bg/my/
            description: Moodle learning platform
        - E-Student:
            href: https://student.nbu.bg/Main.aspx
            description: NBU e-student portal
        - Email:
            href: https://mail.nbu.bg/mail/
            description: NBU email portal
  widgets.yaml: ""
  docker.yaml: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - nodes/stats
    verbs:
      - get
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: homepage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homepage-config-pvc
  namespace: homepage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.tpopov-homelab.duckdns.org"
            - name: TZ
              value: "UTC"
            - name: HOMEPAGE_VAR_TITLE
              value: "Homepage"
            - name: LOG_TARGETS
              value: "stdout"
          volumeMounts:
            - name: config
              mountPath: /app/config
            - name: homepage-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: homepage-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: homepage-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: homepage-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: homepage-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: homepage-config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
            - name: homepage-config
              mountPath: /app/config/custom.css
              subPath: custom.css
            - name: homepage-config
              mountPath: /app/config/custom.js
              subPath: custom.js
          livenessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.tpopov-homelab.duckdns.org
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
              httpHeaders:
                - name: Host
                  value: homepage.tpopov-homelab.duckdns.org
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homepage-config-pvc
        - name: homepage-config
          configMap:
            name: homepage
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
spec:
  type: ClusterIP
  selector:
    app: homepage
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: duckdns
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - homepage.tpopov-homelab.duckdns.org
  rules:
    - host: homepage.tpopov-homelab.duckdns.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 3000
